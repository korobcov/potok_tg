name: Build Windows native app

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
    paths:
      - 'app/**'
      - 'windows/**'
      - 'requirements.txt'
      - '.env.example'
      - '.github/workflows/build-windows.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - 'windows/**'
      - 'requirements.txt'
      - '.env.example'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build native Windows app (PotokBot.exe + ffmpeg + .env.example)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File windows\build.ps1

      - name: Zip the build
        shell: pwsh
        run: Compress-Archive -Path dist\PotokBot\* -DestinationPath PotokBot-windows.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PotokBot-windows
          path: PotokBot-windows.zip
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PotokBot-windows.zip
